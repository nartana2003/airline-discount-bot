name: Check flight prices

on:
  schedule:
    # 07:00 Brisbane (UTC+10) = 21:00 UTC the previous day.
    # Weekly, Monday 07:00 Brisbane. One search = one date pair, so a run costs
    # ~41 searches (200-day window sampled every 5 days). Weekly is ~176/month
    # against a 240 cap; anything more frequent overruns the free tier.
    - cron: "0 21 * * 0"
  workflow_dispatch: # lets you trigger a run by hand from the Actions tab

# Needed so the job can commit state.json back to the repo.
permissions:
  contents: write

concurrency:
  group: flight-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run the watch
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python check.py --no-colour

      # state.json carries the cooldown history and the monthly search count,
      # so it has to survive between runs. prices.jsonl is the accumulating
      # record of every fare seen - it only has value if it keeps growing.
      # Committing both is the simplest durable store that also lets you
      # eyeball the history in the repo.
      - name: Persist state and price history
        if: always()
        run: |
          git config user.name "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          git add state.json prices.jsonl
          git diff --staged --quiet || git commit -m "run: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
