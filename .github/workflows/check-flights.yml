name: Check flight prices

on:
  schedule:
    # 07:00 Brisbane (UTC+10) = 21:00 UTC the previous day.
    # Weekly, Monday 07:00 Brisbane. One search = one date pair, and a run's
    # cost is simply how many dates it samples - but that number is derived,
    # not fixed: plan_sampling() widens the step as routes are added so a
    # month of weekly runs stays under the cap whatever the watchlist holds.
    # Naming a figure here only dates the comment; `python check.py --ui`
    # shows what a run costs today. Anything more frequent than weekly
    # overruns the free tier.
    - cron: "0 21 * * 0"
  workflow_dispatch: # lets you trigger a run by hand from the Actions tab

# Needed so the job can commit state.json back to the repo.
permissions:
  contents: write

concurrency:
  group: flight-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run the watch
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python check.py --no-colour

      # state.json carries the cooldown history and the monthly search count,
      # so it has to survive between runs. prices.jsonl is the accumulating
      # record of every fare seen - it only has value if it keeps growing.
      # Committing both is the simplest durable store that also lets you
      # eyeball the history in the repo.
      - name: Persist state and price history
        if: always()
        run: |
          git config user.name "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          git add state.json prices.jsonl
          git diff --staged --quiet || git commit -m "run: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
