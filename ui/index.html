<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Work+Sans:wght@400;500;600&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f2ede3;
  --card: #fbf8f2;
  --field: #fffdf9;
  --ink: #221e18;
  --ink-2: #6b6357;
  --ink-3: #9a9184;
  --line: #e0d8c9;
  --line-2: #cec4b1;
  --stamp: #9c3226;
  --stamp-soft: #f6e7e3;
  --ok: #3f6b3a;
  --ok-soft: #e9f0e5;
  --warn: #8a5a12;
  --warn-soft: #f6eddc;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Roboto Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14120f; --card: #1c1916; --field: #221e1a;
    --ink: #ece5d8; --ink-2: #a89e8e; --ink-3: #7b7264;
    --line: #2b2721; --line-2: #3d3830;
    --stamp: #e0705f; --stamp-soft: #331d19;
    --ok: #7fb877; --ok-soft: #1b2a19;
    --warn: #d99b45; --warn-soft: #2e2314;
  }
}
:root[data-theme="dark"] {
  --paper: #14120f; --card: #1c1916; --field: #221e1a;
  --ink: #ece5d8; --ink-2: #a89e8e; --ink-3: #7b7264;
  --line: #2b2721; --line-2: #3d3830;
  --stamp: #e0705f; --stamp-soft: #331d19;
  --ok: #7fb877; --ok-soft: #1b2a19;
  --warn: #d99b45; --warn-soft: #2e2314;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 52px 24px 90px; }
.spacer { flex: 1 1 auto; }

/* ---------- masthead ---------- */
.mast {
  display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap;
  border-bottom: 2px solid var(--ink); padding-bottom: 14px; margin-bottom: 32px;
}
h1 { font: 400 34px/1 var(--serif); margin: 0; letter-spacing: -.015em; }
h1 em { font-style: italic; }
.when {
  font: 500 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3); padding-bottom: 4px;
}
.save-pill {
  font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3); background: transparent; border: 1px solid var(--line-2);
  padding: 6px 10px; border-radius: 2px; white-space: nowrap;
  transition: color .18s, background .18s, border-color .18s;
}
.save-pill.saving { color: var(--ink-2); }
.save-pill.saved  { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.save-pill.error  { color: var(--stamp); background: var(--stamp-soft); border-color: transparent; }
.icon-btn {
  border: 1px solid var(--line-2); background: transparent; color: var(--ink-3);
  width: 32px; height: 28px; cursor: pointer; border-radius: 2px;
  display: grid; place-items: center; padding: 0;
}
.icon-btn:hover { color: var(--ink); border-color: var(--ink-2); }

/* ---------- section rule ---------- */
.sec { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.sec h2 {
  font: 500 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase;
  color: var(--ink-2); margin: 0;
}
.sec .rule { flex: 1 1 auto; height: 1px; background: var(--line-2); }

/* ---------- the ticket ---------- */
.routes { display: flex; flex-direction: column; gap: 12px; }
.card {
  display: flex; background: var(--card);
  border: 1px solid var(--line-2); border-radius: 3px;
  transition: opacity .18s, border-color .18s;
}
.card.off { opacity: .55; }
.card.bad { border-color: var(--stamp); }
.stub { flex: 1 1 auto; padding: 22px 24px; min-width: 0; }
.route { display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap; }

/* airport field: printed code above, searchable city beneath */
.ap { position: relative; min-width: 0; flex: 1 1 150px; }
.ap .port-lab {
  display: block; margin-bottom: 7px;
  font: 500 9.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3);
}
.ap .code {
  font: 700 30px/1 var(--mono); letter-spacing: .02em; color: var(--ink);
  min-height: 30px; display: block;
}
.ap.bad .code { color: var(--stamp); }
/* NOT ".empty" - that is the no-routes card below, and the two collided:
   a blank code inherited its 46px padding and border, inflating into a box
   that pushed the search dropdown out of view. */
.ap .code.blank { color: var(--ink-3); letter-spacing: -.02em; }
.ap input {
  font: 400 14px/1.35 var(--serif); color: var(--ink-2); margin-top: 8px;
  width: 100%; border: 0; border-bottom: 1px dashed var(--line-2);
  background: transparent; padding: 0 0 4px; border-radius: 0;
}
.ap input:focus {
  outline: none; color: var(--ink); border-bottom-color: var(--stamp);
  border-bottom-style: solid;
}
.ap input::placeholder { color: var(--ink-3); font-style: italic; }
.ap.bad input { border-bottom-color: var(--stamp); }

.ap-list {
  position: absolute; z-index: 40; top: calc(100% + 8px); left: 0;
  min-width: 260px; max-width: 340px;
  background: var(--card); border: 1px solid var(--line-2); border-radius: 3px;
  box-shadow: 0 14px 34px -12px rgba(34,30,24,.4); overflow: hidden auto;
  max-height: 280px; display: none; padding: 4px;
}
.ap-list.open { display: block; }
.ap-opt {
  display: flex; align-items: center; gap: 11px; padding: 8px 9px;
  cursor: pointer; border-radius: 2px;
}
.ap-opt.on { background: var(--stamp-soft); }
.ap-opt .c {
  font: 700 11px/1 var(--mono); letter-spacing: .08em; color: var(--stamp);
  border: 1px dashed var(--line-2); padding: 5px 6px; border-radius: 2px;
  flex: none; width: 42px; text-align: center;
}
.ap-opt .t { min-width: 0; flex: 1; }
.ap-opt .p {
  font: 500 13.5px/1.3 var(--sans); color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ap-opt .s {
  font: 400 12px/1.3 var(--serif); color: var(--ink-3); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ap-none {
  padding: 16px 12px; font: 400 13px var(--serif); font-style: italic;
  color: var(--ink-3); text-align: center;
}

/* trip length, centred between the two ports */
/* The flight path between the two ports. Trip length used to be typed here,
   but it is the same for every route now and lives in the controls bar. */
.mid { flex: none; padding-top: 26px; text-align: center; width: 100px; }
.mid .u {
  display: block; font: 500 10px/1 var(--mono); letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-3); margin-bottom: 7px;
  font-variant-numeric: tabular-nums;
}
.mid svg { display: block; margin: 0 auto; }

/* ---------- choosers ---------- */
/* Native select, restyled. The arrow is a CSS triangle on the wrapper rather
   than a background-image, because an inlined SVG can't read currentColor and
   would stay dark-on-dark when the theme flips. */
.pick-wrap { position: relative; display: inline-block; max-width: 100%; }
.pick-wrap::after {
  content: ""; position: absolute; right: 9px; top: 50%; margin-top: -2px;
  border: 4px solid transparent; border-top-color: var(--ink-3);
  pointer-events: none;
}
.pick {
  appearance: none; -webkit-appearance: none; max-width: 100%;
  font: 400 13.5px/1.3 var(--serif); color: var(--ink);
  background: var(--field); border: 1px dashed var(--line-2); border-radius: 2px;
  padding: 6px 26px 6px 9px; cursor: pointer;
}
.pick:focus { outline: none; border-color: var(--stamp); border-style: solid; }
.pick:disabled { cursor: default; opacity: .5; }

/* ---------- shared controls ---------- */
/* Cabin, trip length and stops apply to every route, so they sit once above
   the cards rather than repeating on each one. Three fields side by side. */
.controls {
  display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start;
  background: var(--card); border: 1px solid var(--line-2); border-radius: 3px;
  padding: 16px 18px; margin-bottom: 14px;
}
.ctl { flex: 1 1 150px; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.ctl .k {
  font: 500 9.5px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3);
}
.ctl .pick-wrap, .ctl .pick { width: 100%; }
.ctl .trip {
  width: 100%; font: 400 13.5px/1.3 var(--serif); color: var(--ink);
  background: var(--field); border: 1px dashed var(--line-2); border-radius: 2px;
  padding: 6px 9px; font-variant-numeric: tabular-nums;
}
.ctl .trip:focus { outline: none; border-color: var(--stamp); border-style: solid; }
.ctl .trip.bad { border-color: var(--stamp); border-style: solid; }
.ctl-note {
  flex: 1 1 100%; margin: 0;
  font: 400 12.5px/1.45 var(--serif); font-style: italic; color: var(--ink-3);
}
.ctl-note.bad { color: var(--stamp); font-style: normal; }

/* the sampling legend */
.legend {
  display: flex; gap: 26px; margin-top: 20px; padding-top: 16px;
  border-top: 1px solid var(--line); flex-wrap: wrap;
}
.legend .k {
  font: 500 9.5px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3);
}
.legend .v {
  font: 400 14px/1.3 var(--serif); color: var(--ink); margin-top: 5px;
  font-variant-numeric: tabular-nums;
}
.card-err {
  margin-top: 16px; padding: 10px 13px; border-radius: 2px;
  background: var(--stamp-soft); color: var(--stamp);
  font: 400 13px/1.45 var(--sans);
}

/* perforated stub */
.perf {
  flex: none; width: 112px; border-left: 2px dashed var(--line-2);
  padding: 22px 16px; display: flex; flex-direction: column;
  align-items: center; justify-content: space-between; gap: 14px;
}
.perf .lab {
  font: 500 9.5px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3); text-align: center;
}
.toggle { position: relative; width: 42px; height: 24px; cursor: pointer; }
.toggle input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.toggle span {
  position: absolute; inset: 0; border-radius: 99px; background: var(--line-2);
  transition: background .2s; pointer-events: none;
}
.toggle span::after {
  content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%;
  background: var(--card); top: 2px; left: 2px; transition: transform .2s;
  box-shadow: 0 1px 2px rgba(0,0,0,.22);
}
.toggle input:checked + span { background: var(--ok); }
.toggle input:checked + span::after { transform: translateX(18px); }
.toggle input:focus-visible + span { outline: 2px solid var(--stamp); outline-offset: 2px; }
.del {
  border: 0; background: transparent; color: var(--ink-3); cursor: pointer;
  font: 400 11px var(--mono); letter-spacing: .1em; text-transform: uppercase;
  padding: 5px 7px; border-radius: 2px;
}
.del:hover { color: var(--stamp); background: var(--stamp-soft); }

/* ---------- add / empty ---------- */
.add {
  width: 100%; padding: 16px; margin-top: 12px; cursor: pointer;
  background: transparent; border: 1px dashed var(--line-2); border-radius: 3px;
  font: 400 16px/1 var(--serif); color: var(--ink-2);
}
.add:hover { border-color: var(--ink); color: var(--ink); border-style: solid; }
.add:disabled { cursor: default; opacity: .45; }
.add:disabled:hover { border-color: var(--line-2); color: var(--ink-2); border-style: dashed; }
.add-note {
  margin: 9px 0 0; text-align: center;
  font: 400 12.5px/1.5 var(--serif); font-style: italic; color: var(--ink-3);
}
.add-note:empty { display: none; }
.no-routes {
  text-align: center; padding: 46px 24px; background: var(--card);
  border: 1px solid var(--line-2); border-radius: 3px; color: var(--ink-3);
}
.no-routes strong {
  display: block; font: 400 20px/1 var(--serif); color: var(--ink); margin-bottom: 7px;
}
.no-routes p { margin: 0; font-size: 13.5px; }

/* ---------- misc ---------- */
.foot-note { margin: 0; }
.foot-note:empty { display: none; }

/* ---------- digest preview ---------- */
.digest-panel {
  border: 1px solid var(--line-2); background: var(--card); border-radius: 3px;
  padding: 16px 18px 18px; margin-bottom: 34px;
}
.digest-meta {
  margin: 0 0 12px; font: 400 12.5px/1.5 var(--sans); color: var(--ink-2);
}
.digest-meta .due {
  color: var(--stamp); font-weight: 600;
}
/* The framed document is a real email and stays light-mode regardless of the
   panel's theme, the same way it would in an inbox - so it sits on its own
   plain white sheet rather than the page's paper tone, which would otherwise
   clash against it in dark mode. */
.digest-frame {
  display: block; width: 100%; height: 640px; border: 1px solid var(--line-2);
  border-radius: 2px; background: #ffffff;
}
code {
  font: 11.5px var(--mono); background: var(--paper); color: var(--ink-2);
  border: 1px solid var(--line); border-radius: 2px; padding: 1px 5px;
}
.banner {
  background: var(--stamp-soft); color: var(--stamp); border-radius: 3px;
  padding: 14px 16px; margin-bottom: 20px; font-size: 13.5px; line-height: 1.55;
  border: 1px solid var(--stamp);
}
.banner code { background: transparent; border-color: currentColor; color: inherit; }
.banner a { color: inherit; }

@media (max-width: 620px) {
  .wrap { padding: 30px 16px 70px; }
  h1 { font-size: 27px; }
  .card { flex-direction: column; }
  .perf {
    width: auto; border-left: 0; border-top: 2px dashed var(--line-2);
    flex-direction: row; padding: 14px 20px;
  }
  .mid { width: auto; }
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mast">
      <h1>Flight <em>Watch</em></h1>
      <span class="spacer"></span>
      <span class="when" id="cadence"></span>
      <span class="save-pill" id="pill">Loading…</span>
      <button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle theme">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="8"/>
          <path d="M12 4a8 8 0 0 1 0 16" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="banner"></div>
  <div class="sec"><h2>Routes</h2><span class="rule"></span></div>

  <!-- One set of settings for every route. Select options are built from
       CABINS and STOPS in the script, so the labels and the numbers the API
       expects are declared in exactly one place. -->
  <div class="controls" id="controls">
    <label class="ctl">
      <span class="k">Cabin</span>
      <span class="pick-wrap">
        <select class="pick" data-k="travel_class" aria-label="Cabin class" disabled></select>
      </span>
    </label>
    <label class="ctl">
      <span class="k">Trip length</span>
      <input type="number" class="trip" data-k="trip_days" min="1" max="60"
             aria-label="Trip length in days" disabled>
    </label>
    <label class="ctl">
      <span class="k">Stops</span>
      <span class="pick-wrap">
        <select class="pick" data-k="stops" aria-label="Maximum stops" disabled></select>
      </span>
    </label>
    <p class="ctl-note" id="ctl-note"></p>
  </div>

  <div class="routes" id="routes"></div>
  <button class="add" id="add">Add a route</button>
  <p class="add-note" id="add-note"></p>

  <div class="sec"><h2>Digest</h2><span class="rule"></span></div>
  <div class="digest-panel" id="digest-panel">
    <p class="digest-meta" id="digest-meta">Loading…</p>
    <!-- The exact HTML the real digest email sends, rendered by the same
         function - never a JS reimplementation that could drift from it.
         Sandboxed to a plain document: no scripts, and every link opens a
         real tab rather than navigating this frame away from the panel. -->
    <iframe class="digest-frame" id="digest-frame" title="Digest preview"
            sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe>
  </div>

  <p class="foot-note" id="footnote"></p>
</div>

<script>
"use strict";

// The page holds no budget maths of its own. Sampling density and cost come
// from the server, which computes them with the same code a real run uses, so
// the panel can never disagree with what the bot will actually do.
let doc = null;
let summary = null;
let saveTimer = null;

// Airport reference data: [code, city, country, name] x ~6000, served locally.
// Metro codes (TYO, LON, NYC) are stripped at build time - the API accepts them
// and returns zero flights, so they must not be selectable.
let AIRPORTS = [];
let BY_CODE = new Map();
let INDEX = [];   // AIRPORTS with accent-folded fields cached for searching

// Combining diacritical marks U+0300-U+036F, written as escapes on purpose:
// as literal marks they are invisible in an editor and a stray normalisation
// would silently break accent folding.
const fold = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

// Region and island names that appear in no field of the dataset. Most former
// aliases are gone: the data now carries its own keywords, so "bali" finds
// Denpasar and "saigon" finds Ho Chi Minh City without help.
const ALIASES = {
  hawaii: "HNL", fiji: "NAN", sicily: "CTA", tuscany: "FLR",
  "gold coast": "OOL",
  // Cities whose main airport carries no trace of the city name in any field.
  taipei: "TPE",     // "Taiwan Taoyuan International Airport", city Taoyuan
  okinawa: "OKA",    // "Naha Airport" - only Japanese-script keywords mention it
};

// Multi-airport cities where every candidate is the same size class, so size
// alone can't break the tie - without this "london" sorts alphabetically and
// puts Gatwick above Heathrow.
const PRIMARY = new Set(("LHR CDG JFK HND ICN PVG BKK SIN DXB FRA MUC FCO MXP BCN MAD LIS "
  + "AMS BRU CPH ARN OSL HEL DUB ZRH VIE IST SVO GRU EZE SCL LIM BOG MEX YYZ YVR SYD MEL "
  + "BNE AKL DEL BOM HKG TPE MNL CGK SGN HAN KIX NRT LAX ORD SFO SEA BER "
  // DOH ties with the old Doha International, JNB with Lanseria - same city
  // name, same size class, so without this the minor one wins on sort order.
  + "DOH JNB").split(/\s+/));

// Bigger airports first, using the dataset's own size class rather than a
// hand-maintained hub list. Being a city's primary airport outweighs match
// tier entirely: Le Bourget's municipality is exactly "Paris" while Charles de
// Gaulle's is "Paris (Roissy-en-France, Val-d'Oise)", so on match quality alone
// the wrong airport wins. If you typed the city, you meant the main airport.
const sizeBonus = (a) => [12, 5, 1][a[4]] + (PRIMARY.has(a[0]) ? 30 : 0);

// Cabin class and stop filter, numbered exactly as the google_flights engine
// numbers them - these go straight into the search request.
//
// `stops` is a CEILING on what the search will return, not a count, and 0 is
// the opposite of what 0 means on a returned itinerary: as a filter it means
// "don't filter", as a result it means "nonstop". Same word, inverted sense.
const CABINS = { 1: "Economy", 2: "Premium economy", 3: "Business", 4: "First" };
const STOPS = { 0: "Any", 1: "Nonstop only", 2: "1 stop or fewer", 3: "2 stops or fewer" };

// Effective values are read from `doc`, not from the server summary. A summary
// only refreshes after a save round-trip, so a control bound to it would snap
// back to the old value on the re-render that follows the change.
// All three are shared settings: they live in `defaults` and apply to every
// route. Read straight from `doc` rather than from the server summary, which
// only refreshes after a save round-trip and would make a control snap back to
// its old value on the re-render that follows a change.
const SHARED = {
  travel_class: { fallback: 1 },
  trip_days: { fallback: 12 },
  stops: { fallback: 0 },
};
const sharedOf = (key) => +(doc?.defaults?.[key] ?? SHARED[key].fallback);

const options = (map, sel) => Object.entries(map).map(([v, label]) =>
  `<option value="${v}"${+v === sel ? " selected" : ""}>${esc(label)}</option>`).join("");

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => (
  { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function pill(text, cls = "") {
  const el = $("pill");
  el.textContent = text;
  el.className = "save-pill " + cls;
}

// ---------------------------------------------------------------- airport search
function searchAirports(q, limit = 8) {
  q = q.trim().toLowerCase();
  if (!q) return [];

  q = fold(q);
  const alias = ALIASES[q];
  const scored = [];

  for (const e of INDEX) {
    let score = 0;

    if (e.code === q) score = 100;                       // exact code
    else if (alias === e.a[0]) score = 95;               // known nickname
    else if (e.city === q) score = 90;                   // exact city
    else if (e.kw.includes(q)) score = 88;               // "bali", "saigon", "tyo"
    else if (e.city.startsWith(q)) score = 70;
    // "Milan Malpensa International Airport" - the city is only in the name,
    // because the municipality is the suburb the runway happens to sit in.
    else if (e.name.startsWith(q)) score = 66;
    else if (e.kw.some(k => k.startsWith(q))) score = 62;
    else if (e.country.startsWith(q)) score = 45;
    else if (e.city.includes(q)) score = 40;
    else if (e.name.includes(q)) score = 30;
    else if (e.country.includes(q)) score = 15;
    else continue;

    scored.push([score + sizeBonus(e.a), e.a]);
  }

  scored.sort((x, y) => y[0] - x[0] || x[1][1].localeCompare(y[1][1]));
  return scored.slice(0, limit).map(s => s[1]);
}

const displayFor = (code) => {
  const a = BY_CODE.get(code);
  // City only. "Brisbane, Australia" truncated to "Brisbane, Au..." in the
  // field; the code badge sits beside it and the dropdown carries the country.
  return a ? a[1] : (code || "");
};

// ---------------------------------------------------------------- validation
function routeErrors(w) {
  const out = [];
  const code = /^[A-Z]{3}$/;
  if (!code.test(w.origin || "")) out.push("origin");
  if (!code.test(w.destination || "")) out.push("destination");
  if (w.origin && w.origin === w.destination) out.push("same");
  return out;
}
const errorText = {
  origin: "Pick a departure airport.",
  destination: "Pick a destination airport.",
  same: "Origin and destination are the same.",
};

// Trip length is shared, so it is checked once against the controls bar rather
// than reported on every card.
const tripError = () => {
  const n = sharedOf("trip_days");
  return n >= 1 && n <= 60 ? "" : "Trip length must be between 1 and 60 days.";
};
const docValid = () => !tripError()
  && (doc?.watches || []).every(w => routeErrors(w).length === 0);

// ---------------------------------------------------------------- rendering
/** "3 days ago" — coarse on purpose. The figure is only refreshed by a run, so
 *  minutes would imply a precision it does not have. */
function ago(iso) {
  const then = Date.parse(iso);
  if (!Number.isFinite(then)) return "";
  const days = Math.floor((Date.now() - then) / 86400000);
  return days <= 0 ? "today" : days === 1 ? "yesterday" : `${days} days ago`;
}

/** How often the schedule fires. The only run-cost figure left on the page.
 *
 *  The budget docket that used to sit here - routes, searches per run, a meter
 *  against the monthly cap - is gone. It was arithmetic the panel cannot act on:
 *  sampling density is derived, so there is no dial to turn in response to it,
 *  and a run plans from the live quota rather than the cap it was drawn against.
 *  What the numbers were really there to prevent now guards the Add button
 *  directly, which is the moment the decision is actually made.
 */
/** Whether another route can be afforded, and why not when it cannot.
 *
 *  The budget is fixed and split between enabled routes, so adding one never
 *  overspends - plan_sampling simply samples everything more coarsely. What it
 *  can do is thin the sample until a route checks too few dates to find
 *  anything, and that is what this refuses. The projection comes from the
 *  server, which works it out by running the real planner over a trial list.
 */
function renderAdd() {
  const nx = summary?.next_route;
  const blocked = !!nx && nx.ok === false;
  $("add").disabled = blocked || !doc;

  const note = $("add-note");
  if (!blocked) { note.textContent = ""; return; }
  note.textContent = nx.per_month > summary.cap
    ? `Another route would need ${nx.per_month.toLocaleString()} searches a month, `
      + `over the ${summary.cap.toLocaleString()} budget. Pause or remove one first.`
    : `Another route would leave each one checking only ${nx.per_route} dates a run `
      + `— too thin to find much. The monthly budget is fixed and split between `
      + `routes, so pause or remove one first.`;
}

function renderCadence() {
  const n = summary?.runs_per_month;
  $("cadence").textContent = !n ? ""
    : n >= 4 ? "Checked weekly" : `Checked ${n}× a month`;
}

// One airport field, printed like a ticket: the resolved code set large above,
// and beneath it the box you actually type a city into. The code is derived
// from the selection rather than typed, so it reads as stamped, not editable.
function picker(key, code, placeholder, badCls) {
  return `<div class="ap${badCls}" data-field="${key}">
    <span class="port-lab">${key === "origin" ? "From" : "To"}</span>
    <span class="code${code ? "" : " blank"}">${esc(code || "———")}</span>
    <input type="text" data-k="${key}" autocomplete="off" spellcheck="false"
           value="${esc(displayFor(code))}" placeholder="${esc(placeholder)}"
           aria-label="${esc(placeholder)}">
    <div class="ap-list"></div>
  </div>`;
}

function renderRoutes() {
  const el = $("routes");
  const list = doc?.watches || [];

  if (!list.length) {
    el.innerHTML = `<div class="no-routes">
      <p><strong>No routes yet.</strong></p>
      <p>Add one below to start watching a fare.</p></div>`;
    return;
  }

  el.innerHTML = list.map((w, i) => {
    const errs = routeErrors(w);
    const info = summary?.routes?.[i];
    const bad = (k) => errs.includes(k) ? " bad" : "";
    return `<div class="card ${w.enabled === false ? "off" : ""} ${errs.length ? "bad" : ""}" data-i="${i}">
      <div class="stub">
        <div class="route">
          ${picker("origin", w.origin, "From — city or airport", bad("origin"))}
          <div class="mid">
            <span class="u">${sharedOf("trip_days")} days</span>
            <svg width="96" height="26" viewBox="0 0 96 26" fill="none"
                 stroke="currentColor" stroke-width="1.2" style="color:var(--ink-3)">
              <path d="M2 8h74" stroke-dasharray="1 4" stroke-linecap="round"/>
              <path d="M72 5.2 77 8l-5 2.8"/>
              <path d="M94 18H20" stroke-dasharray="1 4" stroke-linecap="round"/>
              <path d="M24 15.2 19 18l5 2.8"/>
            </svg>
          </div>
          ${picker("destination", w.destination, "To — city or airport",
                   bad("destination") + bad("same"))}
        </div>
        ${errs.length
          ? `<div class="card-err">${errs.map(e => esc(errorText[e])).join(" ")}</div>`
          : info && info.searches_per_run
            ? `<div class="legend" title="One search covers one exact date pair, so a run samples the window rather than covering it. The dates sit on a fixed calendar grid, so each weekly run re-prices the same ones and can tell when a fare moves.">
                 <div>
                   <div class="k">Sampling</div>
                   <div class="v">Every ${ordinal(info.step_days)} departure date</div>
                 </div>
                 <div>
                   <div class="k">Window</div>
                   <div class="v">${summary.window.days_from_now_min}–${summary.window.days_from_now_max} days ahead</div>
                 </div>
                 <div>
                   <div class="k">Covering</div>
                   <div class="v">${esc(shortDate(info.first_depart))} – ${esc(info.last_depart)}</div>
                 </div>
               </div>`
            : ""}
      </div>
      <div class="perf">
        <div class="lab">${w.enabled === false ? "Paused" : "Watching"}</div>
        <label class="toggle" title="${w.enabled === false ? "Paused" : "Actively watched"}">
          <input type="checkbox" data-k="enabled" ${w.enabled === false ? "" : "checked"}><span></span>
        </label>
        <button class="del" data-act="del" title="Remove this route">Remove</button>
      </div>
    </div>`;
  }).join("");
}

// Drop the year off the start of a range that ends with one: "22 Oct – 19 Jun 2027".
const shortDate = (s) => String(s || "").replace(/\s+\d{4}$/, "");

// 5 -> "5th". The step is an interval between sampled dates, and "every 5 days"
// reads as how often the bot runs, which is weekly and unrelated.
const ordinal = (n) => {
  const s = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
};

function renderFootnote() {
  // Deliberately empty. Everything that was here - the window, the alert rule,
  // where shared settings live - is documented in the README, and repeating it
  // under every screen just added a wall of grey text to read past.
  $("footnote").innerHTML = "";
}

// Cabin, trip length and stops are shared defaults rather than per-route
// fields, so they are drawn once above the cards. Disabled until there is a
// doc to write them into.
function renderControls() {
  const el = $("controls");
  const cabin = el.querySelector('[data-k="travel_class"]');
  const trip = el.querySelector('[data-k="trip_days"]');
  const stops = el.querySelector('[data-k="stops"]');

  for (const f of [cabin, trip, stops]) f.disabled = !doc;
  cabin.innerHTML = options(CABINS, sharedOf("travel_class"));
  stops.innerHTML = options(STOPS, sharedOf("stops"));

  // Not rewritten while it has focus: replacing the value mid-keystroke moves
  // the caret to the end, so typing "14" over "12" comes out backwards.
  if (document.activeElement !== trip) trip.value = String(sharedOf("trip_days"));

  const err = tripError();
  trip.classList.toggle("bad", !!err);

  // One note at a time, and only when there is something to say: the trip
  // error if the number is unusable, otherwise a reminder of what this
  // setting actually does now - it decides which fares can alert, not which
  // ones get searched for, so it can never zero out a route's results.
  const note = $("ctl-note");
  note.className = "ctl-note" + (err ? " bad" : "");
  note.textContent = err ? err
    : sharedOf("stops") ? "Every date is still searched — this only decides "
      + "which fares can alert. A route with no matching service just won't "
      + "have any."
    : "";
}

function render() {
  renderCadence();
  renderAdd();
  renderControls();
  renderRoutes();
  renderFootnote();
}

// ---------------------------------------------------------------- server I/O
/** fetch + parse JSON, but report what actually came back when it isn't JSON.
 *  A proxy, VPN or antivirus web shield that intercepts localhost returns its
 *  own HTML or text here, and "Unexpected token" tells you nothing useful. */
async function getJSON(url, options) {
  let r;
  try {
    r = await fetch(url, options);
  } catch (err) {
    throw new Error(`Couldn't reach the bot at ${location.host}. Is it still `
      + `running in your terminal? (${err.message})`);
  }
  const text = await r.text();
  try {
    return JSON.parse(text);
  } catch {
    const body = text.trim().slice(0, 120) || "(empty response)";
    throw new Error(`${url} returned ${r.status} ${r.statusText} instead of JSON: `
      + `"${body}". The page loaded, so the bot is running — something between `
      + `your browser and it is filtering requests (proxy, VPN, or an antivirus `
      + `web shield). Try a different browser, or python check.py --ui --port 8790.`);
  }
}

async function loadAirports() {
  try {
    AIRPORTS = await getJSON("/airports.json");
    BY_CODE = new Map(AIRPORTS.map(a => [a[0], a]));
    INDEX = AIRPORTS.map(a => ({
      a,
      code: a[0].toLowerCase(),
      city: fold(a[1]),
      country: fold(a[2]),
      name: fold(a[3]),
      kw: a[5] ? a[5].split("|").map(fold) : [],
    }));
  } catch {
    // Search is a convenience; typing a code by hand must still work without it.
    AIRPORTS = []; BY_CODE = new Map(); INDEX = [];
  }
}

async function load() {
  // Opened by double-clicking the file, or via an editor preview pane. Every
  // fetch below would resolve against file:/// and hang or be blocked, leaving
  // the page stuck on "Loading…" with no clue why. Say so instead.
  if (location.protocol !== "http:" && location.protocol !== "https:") {
    const url = "http://127.0.0.1:8765/";
    $("banner").innerHTML = `<div class="banner" id="fileguard">
      <strong>This page is open as a file, so it can't reach your routes.</strong><br>
      A <code>file://</code> page isn't allowed to read or write
      <code>watches.json</code>. The panel has to be served instead.
      <br><br>
      <span id="guard-action">Checking whether the bot is already running…</span>
    </div>`;
    pill("Not connected", "error");

    // If the server is up, don't strand the reader in a tab that can never
    // work - go there. /api/ping allows cross-origin reads so this check is
    // possible at all. Ports match the default and the one --port suggests.
    const fallback = `<strong>Double-click <code>start-ui.bat</code></strong> in the
      project folder — or run <code>python check.py --ui</code> — then open
      <a href="${url}">${url}</a>`;

    const live = async (port) => {
      try {
        const ctrl = new AbortController();
        setTimeout(() => ctrl.abort(), 1200);
        const r = await fetch(`http://127.0.0.1:${port}/api/ping`, { signal: ctrl.signal });
        return r.ok ? `http://127.0.0.1:${port}/` : null;
      } catch { return null; }
    };

    let found = null;
    for (const port of [8765, 8766, 8767]) {
      found = await live(port);
      if (found) break;
    }

    if (found) {
      $("guard-action").innerHTML =
        `<strong>The bot is running — taking you there now…</strong><br>
         <a href="${found}" style="font-size:15px;font-weight:700">${found}</a>`;
      // replace() so this tab doesn't linger in history to be landed on again.
      setTimeout(() => location.replace(found), 1200);
    } else {
      $("guard-action").innerHTML = fallback;
    }
    return;
  }

  try {
    await loadAirports();
    const data = await getJSON("/api/watches");
    if (data.error) throw new Error(data.error);
    doc = data.doc;
    doc.watches ||= [];
    summary = data.summary;
    pill("Saved", "saved");
    render();
    if (!AIRPORTS.length) {
      $("banner").innerHTML = `<div class="banner">Airport search is unavailable
        (ui/airports.json didn't load) — you can still type 3-letter codes.</div>`;
    }
  } catch (err) {
    $("banner").innerHTML = `<div class="banner">${esc(err.message)}</div>`;
    pill("Error", "error");
  }

  loadDigest();   // isolated: a broken journal must never block route editing
}

/** Preview of the digest, built server-side from the exact function a real
 *  send uses. Covers everything since the last one actually sent, so this
 *  doubles as "what the next digest will say" - nothing durably records what
 *  a past one said, only when it went out. */
async function loadDigest() {
  try {
    const d = await getJSON("/api/digest");
    if (d.error) throw new Error(d.error);

    const when = d.last_sent_at
      ? `Last sent ${esc(ago(d.last_sent_at))}` : "Never sent yet";
    const due = d.due
      ? `<span class="due">${d.last_sent_at ? " — another is due" : " — one is due"}</span>` : "";
    $("digest-meta").innerHTML = `${when}${due} · showing what the next one`
      + ` covers so far — ${esc(d.subject)}`;

    $("digest-frame").srcdoc = d.html;
  } catch (err) {
    $("digest-meta").textContent = `Digest preview unavailable: ${err.message}`;
    $("digest-frame").srcdoc = "";
  }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  if (!docValid()) { pill("Fix errors to save", "error"); return; }
  pill("Saving…", "saving");
  saveTimer = setTimeout(save, 500);
}

async function save() {
  try {
    const data = await getJSON("/api/watches", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(doc),
    });
    if (data.error) throw new Error(data.error);
    summary = data.summary;
    pill("Saved", "saved");
    $("banner").innerHTML = "";
    render();
  } catch (err) {
    pill("Not saved", "error");
    $("banner").innerHTML = `<div class="banner">${esc(err.message)}</div>`;
  }
}

// ---------------------------------------------------------------- editing
// ---------------------------------------------------------------- picker behaviour
let openList = null;   // the .ap currently showing results
let cursor = -1;       // highlighted option within it

function closeList() {
  openList?.querySelector(".ap-list")?.classList.remove("open");
  openList = null;
  cursor = -1;
}

function showList(ap, matches) {
  const list = ap.querySelector(".ap-list");
  if (!matches.length) {
    list.innerHTML = `<div class="ap-none">No airport matches that.</div>`;
  } else {
    list.innerHTML = matches.map((a, i) => `
      <div class="ap-opt ${i === cursor ? "on" : ""}" data-code="${a[0]}">
        <span class="c">${esc(a[0])}</span>
        <span class="t">
          <div class="p">${esc(a[1])}, ${esc(a[2])}</div>
          <div class="s">${esc(a[3])}</div>
        </span>
      </div>`).join("");
  }
  list.classList.add("open");
  openList = ap;
}

function choose(ap, code) {
  const card = ap.closest(".card");
  const w = doc.watches[+card.dataset.i];
  w[ap.dataset.field] = code;
  closeList();
  render();
  scheduleSave();
}

$("routes").addEventListener("input", (e) => {
  const card = e.target.closest(".card");
  const key = e.target.dataset.k;
  if (!card || !key) return;
  const w = doc.watches[+card.dataset.i];

  if (key === "origin" || key === "destination") {
    const ap = e.target.closest(".ap");
    const raw = e.target.value.trim();
    // Typing a bare code still works for anyone who already knows it.
    const asCode = raw.toUpperCase();
    if (/^[A-Z]{3}$/.test(asCode) && BY_CODE.has(asCode)) {
      w[key] = asCode;
      scheduleSave();
    } else {
      w[key] = "";
    }
    cursor = -1;
    showList(ap, searchAirports(raw));
    return;   // no re-render mid-typing - it would blow away the field
  }
});

// ---------------------------------------------------------------- shared controls
/** Write a shared setting, and clear any per-route copy of it.
 *
 *  The loader resolves these as `entry.get(key, defaults.get(key))`, so a value
 *  left on an individual watch shadows the shared one - the control would look
 *  like it had done nothing. Stripping the overrides is what makes "shared"
 *  true rather than merely intended.
 */
function setShared(key, value) {
  doc ||= { watches: [] };
  (doc.defaults ||= {})[key] = value;
  for (const w of doc.watches) delete w[key];
}

$("controls").addEventListener("input", (e) => {
  if (e.target.dataset.k !== "trip_days") return;
  setShared("trip_days", +e.target.value);
  render();          // renderControls leaves a focused field alone, so the
  scheduleSave();    // caret survives; the cards restate the new length
});

// Selects fire `change`, not `input`.
$("controls").addEventListener("change", (e) => {
  const key = e.target.dataset.k;
  if (key !== "travel_class" && key !== "stops") return;
  setShared(key, +e.target.value);
  render();
  scheduleSave();
});

$("routes").addEventListener("keydown", (e) => {
  const ap = e.target.closest(".ap");
  if (!ap || !openList) return;
  const opts = [...ap.querySelectorAll(".ap-opt")];
  if (!opts.length) return;

  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    cursor = (cursor + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length;
    opts.forEach((o, i) => o.classList.toggle("on", i === cursor));
    opts[cursor].scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") {
    e.preventDefault();
    choose(ap, opts[cursor === -1 ? 0 : cursor].dataset.code);
  } else if (e.key === "Escape") {
    closeList();
  }
});

$("routes").addEventListener("mousedown", (e) => {
  const opt = e.target.closest(".ap-opt");
  if (!opt) return;
  e.preventDefault();  // keep focus so blur doesn't fire first
  choose(opt.closest(".ap"), opt.dataset.code);
});

// Leaving a half-typed field resyncs it to whatever code is actually set, and
// surfaces the inline error if that left it empty. Delayed so a click on an
// option is handled first - blur fires before the click would land.
$("routes").addEventListener("focusout", (e) => {
  if (!e.target.closest(".ap")) return;
  setTimeout(() => {
    if (document.activeElement?.closest(".ap")) return;  // moved to the other field
    closeList();
    render();
    scheduleSave();
  }, 140);
});

document.addEventListener("mousedown", (e) => {
  if (openList && !e.target.closest(".ap")) closeList();
});

// Checkboxes fire `change`, not `input`. Re-render so the card dims immediately.
$("routes").addEventListener("change", (e) => {
  const card = e.target.closest(".card");
  if (!card || e.target.dataset.k !== "enabled") return;
  doc.watches[+card.dataset.i].enabled = e.target.checked;
  render();
  scheduleSave();
});

$("routes").addEventListener("click", (e) => {
  const btn = e.target.closest('[data-act="del"]');
  if (!btn) return;
  const i = +btn.closest(".card").dataset.i;
  const w = doc.watches[i];
  if (!confirm(`Remove ${w.origin || "?"} → ${w.destination || "?"}?`)) return;
  doc.watches.splice(i, 1);
  render();
  scheduleSave();
});

$("add").onclick = () => {
  if ($("add").disabled) return;
  doc ||= { watches: [] };
  // Carry the origin over from the last route - you generally fly out of the
  // same airport - but seed nothing when there is no last route. No city is
  // baked in; the very first route asks where you're flying from.
  const origin = doc.watches.at(-1)?.origin || "";
  // No trip_days: it is a shared setting now, so a new route inherits it.
  doc.watches.push({ enabled: true, origin, destination: "" });
  render();
  // Focus whichever field is actually blank.
  const card = document.querySelectorAll(".card")[doc.watches.length - 1];
  card?.querySelector(origin ? '[data-k="destination"]' : '[data-k="origin"]')?.focus();
};

$("theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? null : "dark";
  next ? document.documentElement.setAttribute("data-theme", next)
       : document.documentElement.removeAttribute("data-theme");
};

document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
    e.preventDefault();
    clearTimeout(saveTimer);
    if (docValid()) save();
  }
});

// Fill the controls before the first fetch resolves, so the bar never shows
// empty selects - render() only runs once a doc has actually loaded.
renderControls();
load();
</script>
</body>
</html>
