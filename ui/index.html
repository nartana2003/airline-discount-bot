<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Watch</title>
<style>
:root {
  --bg: #f4f5f7;
  --card: #ffffff;
  --field: #ffffff;
  --ink: #16181d;
  --ink-2: #5a6270;
  --ink-3: #8b93a1;
  --line: #e3e6ec;
  --line-2: #cfd4dd;
  --accent: #2f6df6;
  --accent-soft: #eaf1fe;
  --good: #17794a;
  --good-bg: #e7f5ee;
  --warn: #8a5a00;
  --warn-bg: #fdf3e0;
  --bad: #b4272a;
  --bad-bg: #fdeceb;
  --shadow: 0 1px 2px rgba(16,20,30,.05), 0 4px 12px rgba(16,20,30,.04);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1014; --card: #171a21; --field: #1e222b;
    --ink: #e9ebef; --ink-2: #a3abb8; --ink-3: #6f7885;
    --line: #262b34; --line-2: #333a45;
    --accent: #5b8cff; --accent-soft: #1a2338;
    --good: #5ed49a; --good-bg: #14301f;
    --warn: #e8b661; --warn-bg: #2f2614;
    --bad: #ff8b86; --bad-bg: #331b1b;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  --bg: #0e1014; --card: #171a21; --field: #1e222b;
  --ink: #e9ebef; --ink-2: #a3abb8; --ink-3: #6f7885;
  --line: #262b34; --line-2: #333a45;
  --accent: #5b8cff; --accent-soft: #1a2338;
  --good: #5ed49a; --good-bg: #14301f;
  --warn: #e8b661; --warn-bg: #2f2614;
  --bad: #ff8b86; --bad-bg: #331b1b;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 34px 20px 80px; }

/* ---------- header ---------- */
header { margin-bottom: 26px; }
.title-row { display: flex; align-items: center; gap: 12px; }
h1 { font-size: 21px; margin: 0; letter-spacing: -.02em; font-weight: 680; }
.spacer { flex: 1 1 auto; }

.save-pill {
  font-size: 12.5px; font-weight: 600; padding: 4px 11px; border-radius: 999px;
  background: var(--card); color: var(--ink-3); border: 1px solid var(--line);
  transition: color .15s, background .15s, border-color .15s; white-space: nowrap;
}
.save-pill.saving { color: var(--ink-2); }
.save-pill.saved  { background: var(--good-bg); color: var(--good); border-color: transparent; }
.save-pill.error  { background: var(--bad-bg);  color: var(--bad);  border-color: transparent; }

.icon-btn {
  font: inherit; font-size: 14px; line-height: 1; cursor: pointer;
  background: transparent; border: 1px solid transparent; color: var(--ink-3);
  border-radius: 8px; padding: 7px 9px;
}
.icon-btn:hover { background: var(--card); color: var(--ink); border-color: var(--line); }

/* ---------- budget ---------- */
.budget { margin-top: 16px; }
.budget-line {
  display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap;
  font-size: 13.5px; color: var(--ink-2);
}
.budget-line b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
.bar {
  height: 6px; border-radius: 99px; background: var(--line);
  margin-top: 9px; overflow: hidden;
}
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--good);
         transition: width .3s ease, background .3s; }
.bar.warn i { background: var(--warn); }
.bar.over i { background: var(--bad); }
.budget-note { font-size: 12.5px; color: var(--ink-3); margin-top: 7px; }

/* ---------- route cards ---------- */
.routes { display: flex; flex-direction: column; gap: 12px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 18px; box-shadow: var(--shadow);
  transition: opacity .15s, border-color .15s;
}
.card.off { opacity: .55; }
.card.bad { border-color: var(--bad); }

.card-main { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.airports { display: flex; align-items: center; gap: 8px; }
.arrow { color: var(--ink-3); font-size: 16px; }

input[type=text], input[type=number] {
  font: inherit; color: var(--ink); background: var(--field);
  border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px;
}
input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.code {
  width: 78px; text-transform: uppercase; text-align: center;
  font: 600 16px/1.2 var(--mono); letter-spacing: .06em; padding: 9px 6px;
}
.code.bad { border-color: var(--bad); }
.trip { width: 62px; text-align: center; font-variant-numeric: tabular-nums; }
.unit { font-size: 13.5px; color: var(--ink-2); }

/* iOS-style toggle - the on/off state should read at a glance */
.toggle { position: relative; width: 38px; height: 22px; flex: none; cursor: pointer; }
.toggle input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.toggle span {
  position: absolute; inset: 0; border-radius: 99px; background: var(--line-2);
  transition: background .18s; pointer-events: none;
}
.toggle span::after {
  content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%;
  background: #fff; top: 2px; left: 2px; transition: transform .18s;
  box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.toggle input:checked + span { background: var(--good); }
.toggle input:checked + span::after { transform: translateX(16px); }
.toggle input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.del {
  font: inherit; font-size: 17px; line-height: 1; cursor: pointer; padding: 6px 9px;
  background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--ink-3);
}
.del:hover { background: var(--bad-bg); color: var(--bad); }

.card-foot {
  margin-top: 11px; padding-top: 11px; border-top: 1px solid var(--line);
  font-size: 12.5px; color: var(--ink-3); display: flex; gap: 6px; flex-wrap: wrap;
}
.card-foot b { color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.card-err { margin-top: 10px; font-size: 13px; color: var(--bad); }

.add {
  font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%;
  padding: 13px; margin-top: 12px; color: var(--accent);
  background: transparent; border: 1.5px dashed var(--line-2); border-radius: 12px;
}
.add:hover { border-color: var(--accent); background: var(--accent-soft); }

.empty {
  text-align: center; padding: 48px 24px; color: var(--ink-3);
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
}
.empty p { margin: 0 0 4px; }

.foot-note {
  margin-top: 26px; font-size: 12.5px; color: var(--ink-3); line-height: 1.6;
}
.foot-note code {
  font: 12px var(--mono); background: var(--card);
  border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px;
}
.banner {
  background: var(--bad-bg); color: var(--bad); border-radius: 10px;
  padding: 12px 15px; margin-bottom: 18px; font-size: 13.5px;
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-row">
      <h1>Flight Watch</h1>
      <span class="spacer"></span>
      <span class="save-pill" id="pill">Loading…</span>
      <button class="icon-btn" id="theme" title="Toggle theme">◐</button>
    </div>
    <div class="budget" id="budget"></div>
  </header>

  <div id="banner"></div>
  <div class="routes" id="routes"></div>
  <button class="add" id="add">+ Add route</button>

  <p class="foot-note" id="footnote"></p>
</div>

<script>
"use strict";

// The page holds no budget maths of its own. Sampling density and cost come
// from the server, which computes them with the same code a real run uses, so
// the panel can never disagree with what the bot will actually do.
let doc = null;
let summary = null;
let saveTimer = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => (
  { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function pill(text, cls = "") {
  const el = $("pill");
  el.textContent = text;
  el.className = "save-pill " + cls;
}

// ---------------------------------------------------------------- validation
function routeErrors(w) {
  const out = [];
  const code = /^[A-Z]{3}$/;
  if (!code.test(w.origin || "")) out.push("origin");
  if (!code.test(w.destination || "")) out.push("destination");
  if (w.origin && w.origin === w.destination) out.push("same");
  if (!(+w.trip_days >= 1 && +w.trip_days <= 60)) out.push("trip");
  return out;
}
const errorText = {
  origin: "Origin needs a 3-letter airport code.",
  destination: "Destination needs a 3-letter airport code.",
  same: "Origin and destination are the same.",
  trip: "Trip length must be between 1 and 60 days.",
};
const docValid = () => (doc?.watches || []).every(w => routeErrors(w).length === 0);

// ---------------------------------------------------------------- rendering
function renderBudget() {
  const el = $("budget");
  if (!summary) { el.innerHTML = ""; return; }

  const { per_run, per_month, cap, active, runs_per_month } = summary;
  const pct = cap ? Math.min(per_month / cap * 100, 100) : 0;
  const over = per_month > cap;
  const near = !over && per_month > cap * 0.85;
  const runsWord = runs_per_month >= 4 ? "weekly runs" : `${runs_per_month} runs/month`;

  el.innerHTML = `
    <div class="budget-line">
      <b>${active}</b> route${active === 1 ? "" : "s"} ·
      <b>${per_run}</b> searches per run ·
      <b>${per_month.toLocaleString()}</b> of <b>${cap.toLocaleString()}</b> per month
    </div>
    <div class="bar ${over ? "over" : near ? "warn" : ""}"><i style="width:${pct}%"></i></div>
    <div class="budget-note">
      ${over
        ? `Over your monthly cap — the bot will refuse to start a run.`
        : `Fits, with ${(cap - per_month).toLocaleString()} spare per month at ${runsWord}.`}
      Sampling density is worked out for you: add a route and every route
      samples a little more coarsely to stay inside the cap.
    </div>`;
}

function renderRoutes() {
  const el = $("routes");
  const list = doc?.watches || [];

  if (!list.length) {
    el.innerHTML = `<div class="empty">
      <p><strong>No routes yet.</strong></p>
      <p>Add one below to start watching a fare.</p></div>`;
    return;
  }

  el.innerHTML = list.map((w, i) => {
    const errs = routeErrors(w);
    const info = summary?.routes?.[i];
    const bad = (k) => errs.includes(k) ? " bad" : "";
    return `<div class="card ${w.enabled === false ? "off" : ""} ${errs.length ? "bad" : ""}" data-i="${i}">
      <div class="card-main">
        <div class="airports">
          <input class="code${bad("origin")}" data-k="origin" maxlength="3"
                 value="${esc(w.origin)}" placeholder="BNE" aria-label="Origin airport code">
          <span class="arrow">→</span>
          <input class="code${bad("destination")}${bad("same")}" data-k="destination" maxlength="3"
                 value="${esc(w.destination)}" placeholder="NRT" aria-label="Destination airport code">
        </div>
        <input type="number" class="trip${bad("trip")}" data-k="trip_days" min="1" max="60"
               value="${+w.trip_days || 12}" aria-label="Trip length in days">
        <span class="unit">days</span>
        <span class="spacer"></span>
        <label class="toggle" title="${w.enabled === false ? "Paused" : "Actively watched"}">
          <input type="checkbox" data-k="enabled" ${w.enabled === false ? "" : "checked"}><span></span>
        </label>
        <button class="del" data-act="del" title="Remove this route">×</button>
      </div>
      ${errs.length
        ? `<div class="card-err">${errs.map(e => esc(errorText[e])).join(" ")}</div>`
        : info && info.searches_per_run
          ? `<div class="card-foot">
               <b>${info.searches_per_run}</b> searches per run ·
               every <b>${info.step_days}</b> days ·
               ${esc(info.first_depart)} – ${esc(info.last_depart)}
             </div>`
          : ""}
    </div>`;
  }).join("");
}

function renderFootnote() {
  const w = summary?.window;
  $("footnote").innerHTML = w
    ? `Searching departures <b>${w.days_from_now_min}–${w.days_from_now_max} days</b> ahead
       (300 is the booking horizon — airlines haven't loaded schedules past it).
       Alerts fire when Google rates a fare <b>low</b>, and never twice for the same dates.
       Shared settings live in <code>watches.json</code> under <code>defaults</code>.`
    : "";
}

function render() {
  renderBudget();
  renderRoutes();
  renderFootnote();
}

// ---------------------------------------------------------------- server I/O
async function load() {
  try {
    const r = await fetch("/api/watches");
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    doc = data.doc;
    doc.watches ||= [];
    summary = data.summary;
    pill("Saved", "saved");
    render();
  } catch (err) {
    $("banner").innerHTML = `<div class="banner">Couldn't load watches.json — ${esc(err.message)}</div>`;
    pill("Error", "error");
  }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  if (!docValid()) { pill("Fix errors to save", "error"); return; }
  pill("Saving…", "saving");
  saveTimer = setTimeout(save, 500);
}

async function save() {
  try {
    const r = await fetch("/api/watches", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(doc),
    });
    const data = await r.json();
    if (!r.ok || data.error) throw new Error(data.error || `HTTP ${r.status}`);
    summary = data.summary;
    pill("Saved", "saved");
    render();
  } catch (err) {
    pill("Not saved", "error");
    $("banner").innerHTML = `<div class="banner">${esc(err.message)}</div>`;
  }
}

// ---------------------------------------------------------------- editing
$("routes").addEventListener("input", (e) => {
  const card = e.target.closest(".card");
  const key = e.target.dataset.k;
  if (!card || !key) return;
  const w = doc.watches[+card.dataset.i];

  if (key === "origin" || key === "destination") {
    w[key] = e.target.value.trim().toUpperCase();
    e.target.classList.toggle("bad", !/^[A-Z]{3}$/.test(w[key]));
  } else if (key === "trip_days") {
    w.trip_days = +e.target.value;
  }
  scheduleSave();
});

// Checkboxes fire `change`, not `input`. Re-render so the card dims immediately.
$("routes").addEventListener("change", (e) => {
  const card = e.target.closest(".card");
  if (!card || e.target.dataset.k !== "enabled") return;
  doc.watches[+card.dataset.i].enabled = e.target.checked;
  render();
  scheduleSave();
});

$("routes").addEventListener("click", (e) => {
  const btn = e.target.closest('[data-act="del"]');
  if (!btn) return;
  const i = +btn.closest(".card").dataset.i;
  const w = doc.watches[i];
  if (!confirm(`Remove ${w.origin || "?"} → ${w.destination || "?"}?`)) return;
  doc.watches.splice(i, 1);
  render();
  scheduleSave();
});

$("add").onclick = () => {
  doc ||= { watches: [] };
  doc.watches.push({ enabled: true, origin: "BNE", destination: "", trip_days: 12 });
  render();
  // Focus the empty destination so the next keystroke goes somewhere useful.
  const cards = document.querySelectorAll(".card");
  cards[cards.length - 1]?.querySelector('[data-k="destination"]')?.focus();
};

$("theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? null : "dark";
  next ? document.documentElement.setAttribute("data-theme", next)
       : document.documentElement.removeAttribute("data-theme");
};

document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
    e.preventDefault();
    clearTimeout(saveTimer);
    if (docValid()) save();
  }
});

load();
</script>
</body>
</html>
