<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction D — Departure Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --board: #111112;
  --slot: #1b1c1e;
  --slot-2: #242527;
  --edge: #2f3033;
  --flap: #0b0b0c;
  --amber: #f2b632;
  --amber-dim: #7a5c19;
  --cream: #ece6d8;
  --dim: #7c7a74;
  --go: #5fce7c;
  --mono: "Roboto Mono", ui-monospace, monospace;
  --sans: "Archivo", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: #08080a; color: var(--cream);
  font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 44px 22px 80px; }
.tag {
  font: 500 10.5px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase;
  color: #4d4c49; margin-bottom: 22px;
}

/* board shell */
.board {
  background: var(--board); border: 1px solid var(--edge); border-radius: 4px;
  box-shadow: inset 0 1px 0 #303134, 0 20px 40px -24px #000;
  overflow: hidden; margin-bottom: 18px;
}
.head {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 18px; border-bottom: 1px solid var(--edge); background: #0d0d0f;
}
.head h1 {
  font: 700 13px/1 var(--mono); letter-spacing: .22em; text-transform: uppercase;
  margin: 0; color: var(--amber);
}
.grow { flex: 1 1 auto; }
.head .clock {
  font: 500 11px/1 var(--mono); letter-spacing: .1em; color: var(--dim);
}
.saved {
  font: 700 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
  color: var(--go); border: 1px solid #24422c; background: #102015;
  padding: 5px 8px; border-radius: 2px;
}

/* column headings */
.cols {
  display: grid; grid-template-columns: 92px 92px 1fr 64px 74px 40px;
  gap: 10px; padding: 9px 18px; background: #0d0d0f;
  border-bottom: 1px solid var(--edge);
  font: 500 9.5px/1 var(--mono); letter-spacing: .15em; text-transform: uppercase;
  color: var(--dim);
}
.cols span:nth-child(4), .cols span:nth-child(5) { text-align: center; }

/* the row */
.row {
  display: grid; grid-template-columns: 92px 92px 1fr 64px 74px 40px;
  gap: 10px; align-items: center; padding: 16px 18px;
  border-bottom: 1px solid var(--edge);
}
.flaps { display: flex; gap: 3px; }
.ch {
  width: 27px; height: 38px; border-radius: 2px; background: var(--flap);
  border: 1px solid #262629; position: relative;
  font: 700 21px/38px var(--mono); color: var(--amber); text-align: center;
  box-shadow: inset 0 -6px 10px -8px #000;
}
.ch::after {
  content: ""; position: absolute; left: 0; right: 0; top: 50%;
  border-top: 1px solid rgba(0,0,0,.75);
}
.city { font-size: 12.5px; color: var(--dim); }
.city b { display: block; color: var(--cream); font-weight: 600; font-size: 13.5px; }
.days { text-align: center; }
.days input {
  width: 52px; text-align: center; font: 500 15px/1 var(--mono); color: var(--cream);
  background: var(--flap); border: 1px solid #262629; border-radius: 2px; padding: 8px 4px;
}
.days input:focus { outline: none; border-color: var(--amber); color: var(--amber); }
.days small { display: block; font-size: 9px; letter-spacing: .13em; color: var(--dim); margin-top: 5px; }

/* the flap cells are the editable field - one input styled as the board face */
.flaps input {
  font: 700 21px/1 var(--mono); color: var(--amber); letter-spacing: .34em;
  text-indent: .34em; text-align: center; width: 92px; height: 38px;
  background: var(--flap); border: 1px solid #262629; border-radius: 2px; padding: 0;
  background-image: linear-gradient(transparent 49%, rgba(0,0,0,.75) 49%, rgba(0,0,0,.75) 51%, transparent 51%);
}
.flaps input:focus { outline: none; border-color: var(--amber); }
.city input {
  display: block; background: transparent; border: 0; padding: 0; width: 100%;
  font: 600 13.5px/1.4 var(--sans); color: var(--cream);
}
.city input:focus { outline: none; color: var(--amber); }
.stat { text-align: center; }
.pillgo {
  display: inline-block; font: 700 9.5px/1 var(--mono); letter-spacing: .13em;
  text-transform: uppercase; color: var(--go); border: 1px solid #24422c;
  background: #102015; padding: 6px 9px; border-radius: 2px;
}
.x {
  border: 0; background: transparent; color: #55534e; cursor: pointer;
  font: 400 17px var(--mono); padding: 4px;
}
.x:hover { color: #e2624f; }

.addrow {
  padding: 14px 18px; text-align: center; cursor: pointer;
  font: 500 10.5px var(--mono); letter-spacing: .16em; text-transform: uppercase;
  color: var(--dim); background: transparent; border: 0; width: 100%;
}
.addrow:hover { color: var(--amber); background: #131315; }

/* footer strip = budget, styled like a gate info bar */
.strip {
  display: grid; grid-template-columns: repeat(4, minmax(0,1fr));
  border: 1px solid var(--edge); border-radius: 4px; background: var(--slot);
  overflow: hidden;
}
.cellb { padding: 13px 16px; border-right: 1px solid var(--edge); }
.cellb:last-child { border-right: 0; }
.cellb .l {
  font: 500 9px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--dim);
}
.cellb .v {
  font: 700 20px/1 var(--mono); margin-top: 9px; color: var(--cream);
  font-variant-numeric: tabular-nums;
}
.cellb .v.hot { color: var(--amber); }
.cellb .v small { font-size: 11px; color: var(--dim); font-weight: 400; }
.qbar { height: 4px; background: var(--slot-2); margin-top: 11px; border-radius: 2px; overflow: hidden; }
.qbar i { display: block; height: 100%; width: 88%; background: var(--amber); }
.note {
  font: 400 11px/1.5 var(--sans); color: #5a5955; margin-top: 14px; text-align: center;
  letter-spacing: .02em;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="tag">Direction D · Departure Board</div>

  <div class="board">
    <div class="head">
      <h1>Flight Watch</h1>
      <span class="grow"></span>
      <span class="clock">CHECKED WEEKLY · MON 07:00</span>
      <span class="saved">Saved</span>
    </div>

    <div class="cols">
      <span>From</span><span>To</span><span>Destination</span>
      <span>Trip</span><span>Status</span><span></span>
    </div>

    <div class="row">
      <div class="flaps"><input value="BNE" maxlength="3" aria-label="Origin code"></div>
      <div class="flaps"><input value="NRT" maxlength="3" aria-label="Destination code"></div>
      <div class="city">
        <input value="Narita, Japan" aria-label="Destination city">
        from Brisbane · 23 Oct – 20 Jun 27
      </div>
      <div class="days">
        <input type="number" value="12" min="1" max="60" aria-label="Trip length">
        <small>DAYS</small>
      </div>
      <div class="stat"><span class="pillgo">Watching</span></div>
      <div><button class="x">&times;</button></div>
    </div>

    <button class="addrow">+ Add route</button>
  </div>

  <div class="strip">
    <div class="cellb"><div class="l">Routes</div><div class="v">1</div></div>
    <div class="cellb"><div class="l">Per run</div><div class="v">49</div></div>
    <div class="cellb"><div class="l">Sampling</div><div class="v">5<small>th date</small></div></div>
    <div class="cellb">
      <div class="l">Monthly quota</div>
      <div class="v hot">211<small> / 240</small></div>
      <div class="qbar"><i></i></div>
    </div>
  </div>

  <div class="note">Rolling window 60–300 days ahead</div>
</div>
</body>
</html>
