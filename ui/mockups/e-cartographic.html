<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction E — Cartographic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --sea: #eef1ee;
  --land: #e3e6df;
  --card: #fbfcfa;
  --ink: #1f2521;
  --ink-2: #5c665e;
  --ink-3: #8f9891;
  --line: #dde2dc;
  --line-2: #c7cec6;
  --route: #b8562f;
  --route-soft: #f6e9e3;
  --ok: #2f6b4f;
  --ok-soft: #e6f0ea;
  --sans: "Karla", system-ui, sans-serif;
  --mono: "Roboto Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--sea); color: var(--ink);
  font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 700px; margin: 0 auto; padding: 46px 22px 80px; }
.tag {
  font: 500 10.5px/1 var(--mono); letter-spacing: .15em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 24px;
}

.top { display: flex; align-items: baseline; gap: 12px; margin-bottom: 26px; }
h1 { font: 700 21px/1 var(--sans); margin: 0; letter-spacing: -.01em; }
.coord { font: 400 11px/1 var(--mono); color: var(--ink-3); letter-spacing: .06em; }
.grow { flex: 1 1 auto; }
.saved {
  font: 600 10.5px/1 var(--mono); letter-spacing: .11em; text-transform: uppercase;
  color: var(--ok); background: var(--ok-soft); padding: 6px 10px; border-radius: 99px;
}
.ghost {
  border: 1px solid var(--line-2); background: var(--card); color: var(--ink-3);
  width: 32px; height: 28px; cursor: pointer; border-radius: 99px;
  display: grid; place-items: center;
}

/* the chart */
.chart {
  background: var(--card); border: 1px solid var(--line-2); border-radius: 6px;
  padding: 0; overflow: hidden; margin-bottom: 12px;
}
.plot { position: relative; background: var(--land); }
.plot svg { display: block; width: 100%; height: auto; }
.endcap {
  position: absolute; background: var(--card); border: 1px solid var(--line-2);
  border-radius: 5px; padding: 9px 12px; box-shadow: 0 2px 8px -4px rgba(0,0,0,.25);
}
.endcap .c {
  font: 700 17px/1 var(--mono); letter-spacing: .03em; color: var(--ink);
  width: 56px; border: 0; border-bottom: 1.5px solid var(--line-2); background: transparent;
  padding: 0 0 4px; border-radius: 0;
}
.endcap .c:focus { outline: none; border-bottom-color: var(--route); }
.endcap .n {
  font: 400 11.5px var(--sans); color: var(--ink-2); margin-top: 5px; width: 86px;
  border: 0; background: transparent; padding: 0;
}
.endcap .n:focus { outline: none; color: var(--ink); }
.endcap.from { left: 26px; bottom: 24px; }
.endcap.to { right: 26px; top: 24px; }

.legrow {
  display: flex; align-items: center; gap: 14px;
  padding: 15px 18px; border-top: 1px solid var(--line);
}
.tripwrap { display: flex; align-items: center; gap: 7px; flex: none; }
.trip {
  font: 500 13px/1 var(--mono); color: var(--ink); background: var(--route-soft);
  border: 1px solid #e8d3c9; padding: 8px 6px; border-radius: 5px;
  width: 48px; text-align: center;
}
.trip:focus { outline: none; border-color: var(--route); }
.tripwrap .u { font-size: 12.5px; color: var(--ink-2); }
.facts { display: flex; gap: 22px; flex: 1 1 auto; flex-wrap: wrap; min-width: 0; }
.f .k {
  font: 500 9px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3);
}
.f .v { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; font-variant-numeric: tabular-nums; }
.sw { position: relative; width: 40px; height: 23px; flex: none; cursor: pointer; }
.sw input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.sw span { position: absolute; inset: 0; border-radius: 99px; background: var(--line-2); transition: background .2s; }
.sw span::after {
  content: ""; position: absolute; width: 19px; height: 19px; border-radius: 50%;
  background: #fff; top: 2px; left: 2px; transition: transform .2s;
  box-shadow: 0 1px 2px rgba(0,0,0,.22);
}
.sw input:checked + span { background: var(--ok); }
.sw input:checked + span::after { transform: translateX(17px); }
.x { border: 0; background: transparent; color: var(--ink-3); cursor: pointer;
     font-size: 17px; line-height: 1; padding: 4px 6px; flex: none; }
.x:hover { color: var(--route); }

.add {
  width: 100%; padding: 14px; cursor: pointer; background: var(--card);
  border: 1px dashed var(--line-2); border-radius: 6px;
  font: 500 13.5px var(--sans); color: var(--ink-2); margin-bottom: 26px;
}
.add:hover { border-color: var(--ok); color: var(--ok); }

/* scale bar = budget */
.scale { background: var(--card); border: 1px solid var(--line-2); border-radius: 6px; padding: 16px 18px; }
.scale .hd {
  display: flex; justify-content: space-between; align-items: baseline;
  font: 500 9.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 12px;
}
.scale .hd b { font: 700 14px/1 var(--mono); color: var(--ink); letter-spacing: 0; }
.ruler { display: flex; align-items: flex-end; gap: 0; height: 26px; }
.ruler i {
  flex: 1 1 0; border-left: 1px solid var(--line-2); height: 9px; position: relative;
}
.ruler i:last-child { border-right: 1px solid var(--line-2); }
.ruler i.tall { height: 18px; }
.ruler i.used { background: var(--route-soft); }
.rl {
  display: flex; justify-content: space-between; margin-top: 7px;
  font: 400 10px/1 var(--mono); color: var(--ink-3);
}
.sum { display: flex; gap: 26px; margin-top: 15px; padding-top: 14px; border-top: 1px solid var(--line); }
.sum .k { font: 500 9px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.sum .v { font: 600 17px/1 var(--sans); margin-top: 5px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <div class="tag">Direction E · Cartographic</div>

  <div class="top">
    <h1>Flight Watch</h1>
    <span class="coord">27.4°S 153.1°E → 35.8°N 140.4°E</span>
    <span class="grow"></span>
    <span class="saved">Saved</span>
    <button class="ghost">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16" fill="currentColor" stroke="none"/>
      </svg>
    </button>
  </div>

  <div class="chart">
    <div class="plot">
      <svg viewBox="0 0 660 230" role="img" aria-label="Route arc from Brisbane to Narita">
        <defs>
          <pattern id="grat" width="44" height="44" patternUnits="userSpaceOnUse">
            <path d="M44 0H0v44" fill="none" stroke="#d3d8cf" stroke-width="1"/>
          </pattern>
        </defs>
        <rect width="660" height="230" fill="url(#grat)"/>
        <path d="M0 150c90-6 150 10 210 4s110-40 180-52 180-6 270 4" fill="none"
              stroke="#c9d0c6" stroke-width="1.5"/>
        <path d="M0 196c120 4 210-8 300-16s230-2 360 8" fill="none"
              stroke="#c9d0c6" stroke-width="1.5"/>
        <path id="arc" d="M96 176C240 96 420 40 566 62" fill="none"
              stroke="#b8562f" stroke-width="2" stroke-dasharray="7 5" stroke-linecap="round"/>
        <circle cx="96" cy="176" r="5.5" fill="#fbfcfa" stroke="#b8562f" stroke-width="2.5"/>
        <circle cx="566" cy="62" r="5.5" fill="#b8562f" stroke="#fbfcfa" stroke-width="2.5"/>
        <g fill="#8f9891" font-family="Roboto Mono, monospace" font-size="9" letter-spacing="1.4">
          <text x="16" y="24">PACIFIC</text>
          <text x="560" y="214">CORAL SEA</text>
        </g>
      </svg>
      <div class="endcap from">
        <input class="c" value="BNE" maxlength="3" aria-label="Origin code">
        <input class="n" value="Brisbane" aria-label="Origin city">
      </div>
      <div class="endcap to">
        <input class="c" value="NRT" maxlength="3" aria-label="Destination code">
        <input class="n" value="Narita" aria-label="Destination city">
      </div>
    </div>

    <div class="legrow">
      <span class="tripwrap">
        <input class="trip" type="number" value="12" min="1" max="60" aria-label="Trip length">
        <span class="u">days</span>
      </span>
      <div class="facts">
        <div class="f"><div class="k">Sampling</div><div class="v">every 5th date</div></div>
        <div class="f"><div class="k">Window</div><div class="v">60–300 days</div></div>
        <div class="f"><div class="k">Covering</div><div class="v">23 Oct – 20 Jun 27</div></div>
      </div>
      <label class="sw"><input type="checkbox" checked><span></span></label>
      <button class="x">&times;</button>
    </div>
  </div>

  <button class="add">+ Add a route</button>

  <div class="scale">
    <div class="hd"><span>Monthly search quota</span><b>211 / 240</b></div>
    <div class="ruler">
      <i class="tall used"></i><i class="used"></i><i class="used"></i><i class="used"></i>
      <i class="tall used"></i><i class="used"></i><i class="used"></i><i class="used"></i>
      <i class="tall used"></i><i class="used"></i><i class="used"></i><i class="used"></i>
      <i class="tall used"></i><i class="used"></i><i class="used"></i><i class="used"></i>
      <i class="tall used"></i><i class="used"></i><i></i><i></i>
      <i class="tall"></i>
    </div>
    <div class="rl"><span>0</span><span>60</span><span>120</span><span>180</span><span>240</span></div>
    <div class="sum">
      <div><div class="k">Routes</div><div class="v">1</div></div>
      <div><div class="k">Per run</div><div class="v">49</div></div>
      <div><div class="k">Spare</div><div class="v">29</div></div>
    </div>
  </div>
</div>
</body>
</html>
