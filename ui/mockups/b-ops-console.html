<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction B — Ops Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0c0f;
  --panel: #10141a;
  --panel-2: #161b23;
  --ink: #e6ebf2;
  --ink-2: #8d99a9;
  --ink-3: #5a6674;
  --line: #1e242e;
  --line-2: #2a323e;
  --live: #3ddc97;
  --live-dim: #0f2a20;
  --hot: #ffb545;
  --hot-dim: #2a1f0d;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --sans: "Space Grotesk", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(circle at 1px 1px, #151b24 1px, transparent 0);
  background-size: 28px 28px;
}
.wrap { max-width: 740px; margin: 0 auto; padding: 44px 22px 80px; }
.tag {
  font: 500 10.5px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 24px;
}

/* header strip */
.bar {
  display: flex; align-items: center; gap: 12px;
  border: 1px solid var(--line-2); border-radius: 2px; background: var(--panel);
  padding: 12px 15px; margin-bottom: 14px;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); flex: none;
       box-shadow: 0 0 0 3px var(--live-dim); }
h1 {
  font: 700 13px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
  margin: 0; color: var(--ink);
}
.grow { flex: 1 1 auto; }
.state {
  font: 500 10.5px/1 var(--mono); letter-spacing: .11em; text-transform: uppercase;
  color: var(--live); background: var(--live-dim); padding: 6px 9px; border-radius: 2px;
}
.ghost {
  border: 1px solid var(--line-2); background: transparent; color: var(--ink-3);
  width: 30px; height: 27px; border-radius: 2px; cursor: pointer;
  display: grid; place-items: center;
}
.ghost:hover { color: var(--ink); border-color: var(--ink-3); }

/* telemetry */
.tele {
  display: grid; grid-template-columns: repeat(4, minmax(0,1fr));
  border: 1px solid var(--line-2); border-radius: 2px; background: var(--panel);
  margin-bottom: 14px;
}
.cell { padding: 14px 15px; border-right: 1px solid var(--line); }
.cell:last-child { border-right: 0; }
.cell .l {
  font: 500 9.5px/1 var(--mono); letter-spacing: .15em; text-transform: uppercase;
  color: var(--ink-3);
}
.cell .n {
  font: 700 23px/1 var(--mono); margin-top: 9px; font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
}
.cell .n.hot { color: var(--hot); }
.cell .u { font-size: 11px; color: var(--ink-3); font-weight: 400; margin-left: 2px; }

.gauge {
  border: 1px solid var(--line-2); border-top: 0; background: var(--panel);
  padding: 12px 15px 14px; margin-top: -14px; margin-bottom: 26px; border-radius: 0 0 2px 2px;
}
.gauge .head {
  display: flex; justify-content: space-between;
  font: 500 9.5px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 8px;
}
.ticks { display: flex; gap: 2px; }
.ticks i { height: 14px; flex: 1 1 0; background: var(--line-2); border-radius: 1px; }
.ticks i.on { background: var(--hot); }

/* route rows */
.sec {
  font: 500 9.5px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase;
  color: var(--ink-3); margin: 0 0 9px 1px; display: flex; gap: 9px; align-items: center;
}
.sec .n { color: var(--ink-2); }
.rt {
  border: 1px solid var(--line-2); border-radius: 2px; background: var(--panel);
  margin-bottom: 8px;
}
.rt .main {
  display: flex; align-items: center; gap: 14px; padding: 14px 15px;
}
.pair { display: flex; align-items: center; gap: 11px; flex: 1 1 auto; min-width: 0; }
.iata {
  font: 700 19px/1 var(--mono); letter-spacing: .04em; color: var(--ink);
  background: var(--panel-2); border: 1px solid var(--line-2);
  padding: 8px 10px; border-radius: 2px; width: 62px; text-align: center;
}
.iata:focus { outline: none; border-color: var(--live); color: var(--live); }
.arr { color: var(--ink-3); font: 400 15px var(--mono); }
.names { font: 400 11px/1.35 var(--sans); color: var(--ink-3); min-width: 0; }
.names input {
  display: block; background: transparent; border: 0; color: var(--ink-2);
  font: 500 11px/1.35 var(--sans); padding: 0; width: 100%;
}
.names input:focus { outline: none; color: var(--ink); }
.names small { color: var(--ink-3); }
.dur {
  font: 500 12px/1 var(--mono); color: var(--ink); background: var(--panel-2);
  border: 1px solid var(--line-2); padding: 8px 6px; border-radius: 2px; flex: none;
  width: 46px; text-align: center;
}
.dur:focus { outline: none; border-color: var(--live); color: var(--live); }
.durwrap { display: flex; align-items: center; gap: 6px; flex: none; }
.durwrap .u {
  font: 500 9.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3);
}
.sw { position: relative; width: 36px; height: 20px; flex: none; cursor: pointer; }
.sw input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.sw span { position: absolute; inset: 0; border-radius: 2px; background: var(--line-2); transition: background .18s; }
.sw span::after {
  content: ""; position: absolute; width: 14px; height: 14px; border-radius: 1px;
  background: #0a0c0f; top: 3px; left: 3px; transition: transform .18s;
}
.sw input:checked + span { background: var(--live); }
.sw input:checked + span::after { transform: translateX(16px); }
.x { border: 0; background: transparent; color: var(--ink-3); cursor: pointer;
     font: 400 16px var(--mono); padding: 4px 6px; }
.x:hover { color: #ff6b6b; }

.rt .foot {
  border-top: 1px solid var(--line); padding: 9px 15px;
  display: flex; gap: 0; flex-wrap: wrap; background: #0d1116;
}
.f { padding-right: 18px; margin-right: 18px; border-right: 1px solid var(--line-2); }
.f:last-child { border-right: 0; margin-right: 0; padding-right: 0; }
.f .k {
  font: 500 9px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3);
}
.f .v { font: 500 11.5px/1 var(--mono); color: var(--ink-2); margin-top: 5px; }

.add {
  width: 100%; padding: 13px; margin-top: 4px; cursor: pointer;
  background: transparent; border: 1px dashed var(--line-2); border-radius: 2px;
  font: 500 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3);
}
.add:hover { border-color: var(--live); color: var(--live); }
</style>
</head>
<body>
<div class="wrap">
  <div class="tag">Direction B · Ops Console</div>

  <div class="bar">
    <span class="dot"></span>
    <h1>Flight Watch</h1>
    <span class="grow"></span>
    <span class="state">Saved</span>
    <button class="ghost">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16" fill="currentColor" stroke="none"/>
      </svg>
    </button>
  </div>

  <div class="tele">
    <div class="cell"><div class="l">Routes</div><div class="n">1</div></div>
    <div class="cell"><div class="l">Per run</div><div class="n">49</div></div>
    <div class="cell"><div class="l">Per month</div><div class="n hot">211</div></div>
    <div class="cell"><div class="l">Quota</div><div class="n">240<span class="u">max</span></div></div>
  </div>
  <div class="gauge">
    <div class="head"><span>Quota consumed</span><span>88%</span></div>
    <div class="ticks">
      <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>
      <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>
      <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>
      <i class="on"></i><i class="on"></i><i></i><i></i><i></i>
    </div>
  </div>

  <div class="sec">Watchlist <span class="n">1 active</span></div>

  <div class="rt">
    <div class="main">
      <div class="pair">
        <input class="iata" value="BNE" maxlength="3" aria-label="Origin code">
        <span class="arr">&rarr;</span>
        <input class="iata" value="NRT" maxlength="3" aria-label="Destination code">
        <span class="names">
          <input value="Brisbane" aria-label="Origin city">
          <input value="Narita, Japan" aria-label="Destination city">
        </span>
      </div>
      <span class="durwrap">
        <input class="dur" type="number" value="12" min="1" max="60" aria-label="Trip length">
        <span class="u">days</span>
      </span>
      <label class="sw"><input type="checkbox" checked><span></span></label>
      <button class="x">&times;</button>
    </div>
    <div class="foot">
      <div class="f"><div class="k">Step</div><div class="v">every 5th date</div></div>
      <div class="f"><div class="k">Window</div><div class="v">60–300d ahead</div></div>
      <div class="f"><div class="k">Range</div><div class="v">23 Oct → 20 Jun 27</div></div>
      <div class="f"><div class="k">Cost</div><div class="v">49 / run</div></div>
    </div>
  </div>

  <button class="add">+ Add route</button>
</div>
</body>
</html>
