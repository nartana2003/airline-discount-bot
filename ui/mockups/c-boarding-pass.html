<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction C — Boarding Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Work+Sans:wght@400;500;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f2ede3;
  --card: #fbf8f2;
  --ink: #221e18;
  --ink-2: #6b6357;
  --ink-3: #9a9184;
  --line: #e0d8c9;
  --line-2: #cec4b1;
  --stamp: #9c3226;
  --stamp-soft: #f6e7e3;
  --ok: #3f6b3a;
  --ok-soft: #e9f0e5;
  --serif: "Newsreader", Georgia, serif;
  --sans: "Work Sans", system-ui, sans-serif;
  --mono: "Roboto Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 680px; margin: 0 auto; padding: 52px 24px 80px; }
.tag {
  font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 26px;
}

/* masthead */
.mast {
  display: flex; align-items: flex-end; gap: 14px;
  border-bottom: 2px solid var(--ink); padding-bottom: 14px; margin-bottom: 8px;
}
h1 {
  font: 400 34px/1 var(--serif); margin: 0; letter-spacing: -.015em;
}
h1 em { font-style: italic; }
.grow { flex: 1 1 auto; }
.saved {
  font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
  color: var(--ok); background: var(--ok-soft); padding: 6px 10px; border-radius: 2px;
}
.ghost {
  border: 1px solid var(--line-2); background: transparent; color: var(--ink-3);
  width: 32px; height: 28px; cursor: pointer; border-radius: 2px;
  display: grid; place-items: center;
}
.subline {
  display: flex; justify-content: space-between;
  font: 500 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 34px;
}

/* budget as a stamped docket */
.docket {
  border: 1px solid var(--line-2); background: var(--card); border-radius: 2px;
  padding: 20px 22px; margin-bottom: 34px; position: relative; overflow: hidden;
}
.docket::after {
  content: "88% USED"; position: absolute; right: -34px; top: 16px;
  transform: rotate(28deg); border: 2px solid var(--stamp); color: var(--stamp);
  font: 700 12px/1 var(--mono); letter-spacing: .12em; padding: 6px 40px;
  opacity: .32; border-radius: 2px;
}
.figs { display: flex; gap: 34px; }
.fig .n {
  font: 400 32px/1 var(--serif); font-variant-numeric: tabular-nums; letter-spacing: -.02em;
}
.fig .n .of { font-size: 17px; color: var(--ink-3); }
.fig .l {
  font: 500 10px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3); margin-top: 7px;
}
.strip { display: flex; gap: 3px; margin-top: 18px; }
.strip i { height: 8px; flex: 1 1 0; background: var(--line); }
.strip i.on { background: var(--stamp); opacity: .75; }

/* section rule */
.sechead {
  display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
}
.sechead h2 {
  font: 500 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase;
  color: var(--ink-2); margin: 0;
}
.sechead .rule { flex: 1 1 auto; height: 1px; background: var(--line-2); }

/* the ticket */
.ticket {
  display: flex; background: var(--card);
  border: 1px solid var(--line-2); border-radius: 3px; margin-bottom: 12px;
}
.stub { flex: 1 1 auto; padding: 22px 24px; min-width: 0; }
.route { display: flex; align-items: flex-start; gap: 20px; }
.pt { min-width: 0; }
.pt .code {
  font: 700 30px/1 var(--mono); letter-spacing: .02em; color: var(--ink);
  width: 4ch; border: 0; border-bottom: 1px dashed var(--line-2); background: transparent;
  padding: 0 0 5px; border-radius: 0; text-transform: uppercase;
}
.pt .code:focus { outline: none; border-bottom-color: var(--stamp); }
.pt .city {
  font: 400 14px/1.3 var(--serif); color: var(--ink-2); margin-top: 7px;
  width: 17ch; border: 0; border-bottom: 1px dashed var(--line-2);
  background: transparent; padding: 0 0 3px;
}
.pt .city:focus { outline: none; color: var(--ink); border-bottom-color: var(--stamp); }
.mid { flex: none; padding-top: 6px; text-align: center; width: 96px; }
.mid .days {
  font: 500 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3);
}
.mid input {
  width: 52px; text-align: center; font: 700 17px/1 var(--mono); color: var(--ink);
  background: var(--card); border: 1px dashed var(--line-2); border-radius: 2px;
  padding: 6px 4px; margin-bottom: 6px;
}
.mid input:focus { outline: none; border-color: var(--stamp); border-style: solid; }
.mid svg { display: block; margin: 6px auto 0; }

.legend {
  display: flex; gap: 26px; margin-top: 20px; padding-top: 16px;
  border-top: 1px solid var(--line); flex-wrap: wrap;
}
.legend .k {
  font: 500 9.5px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3);
}
.legend .v { font: 400 14px/1.3 var(--serif); color: var(--ink); margin-top: 5px; }

/* perforated right edge */
.perf {
  flex: none; width: 108px; border-left: 2px dashed var(--line-2);
  padding: 22px 18px; display: flex; flex-direction: column;
  align-items: center; justify-content: space-between; gap: 14px;
}
.perf .lab {
  font: 500 9.5px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3); text-align: center;
}
.sw { position: relative; width: 42px; height: 24px; cursor: pointer; }
.sw input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.sw span { position: absolute; inset: 0; border-radius: 99px; background: var(--line-2); transition: background .2s; }
.sw span::after {
  content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%;
  background: var(--card); top: 2px; left: 2px; transition: transform .2s;
  box-shadow: 0 1px 2px rgba(0,0,0,.22);
}
.sw input:checked + span { background: var(--ok); }
.sw input:checked + span::after { transform: translateX(18px); }
.x {
  border: 0; background: transparent; color: var(--ink-3); cursor: pointer;
  font: 400 11px var(--mono); letter-spacing: .1em; text-transform: uppercase;
  padding: 4px 6px;
}
.x:hover { color: var(--stamp); }

.add {
  width: 100%; padding: 15px; cursor: pointer; background: transparent;
  border: 1px dashed var(--line-2); border-radius: 3px;
  font: 400 16px/1 var(--serif); color: var(--ink-2);
}
.add:hover { border-color: var(--ink); color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <div class="tag">Direction C · Boarding Pass</div>

  <div class="mast">
    <h1>Flight <em>Watch</em></h1>
    <span class="grow"></span>
    <span class="saved">Saved</span>
    <button class="ghost">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16" fill="currentColor" stroke="none"/>
      </svg>
    </button>
  </div>
  <div class="subline"><span>Departing Brisbane</span><span>Checked weekly</span></div>

  <div class="docket">
    <div class="figs">
      <div class="fig"><div class="n">1</div><div class="l">Route</div></div>
      <div class="fig"><div class="n">49</div><div class="l">Per run</div></div>
      <div class="fig"><div class="n">211<span class="of"> / 240</span></div><div class="l">Searches a month</div></div>
    </div>
    <div class="strip">
      <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>
      <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>
      <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i>
    </div>
  </div>

  <div class="sechead"><h2>Routes</h2><span class="rule"></span></div>

  <div class="ticket">
    <div class="stub">
      <div class="route">
        <div class="pt">
          <input class="code" value="BNE" maxlength="3" aria-label="Origin code">
          <input class="city" value="Brisbane, Australia" aria-label="Origin city">
        </div>
        <div class="mid">
          <input type="number" value="12" min="1" max="60" aria-label="Trip length">
          <div class="days">days</div>
          <svg width="96" height="26" viewBox="0 0 96 26" fill="none" stroke="#9a9184" stroke-width="1.2">
            <path d="M2 8h74" stroke-dasharray="1 4" stroke-linecap="round"/>
            <path d="M72 5.2 77 8l-5 2.8"/>
            <path d="M94 18H20" stroke-dasharray="1 4" stroke-linecap="round"/>
            <path d="M24 15.2 19 18l5 2.8"/>
          </svg>
        </div>
        <div class="pt">
          <input class="code" value="NRT" maxlength="3" aria-label="Destination code">
          <input class="city" value="Narita, Japan" aria-label="Destination city">
        </div>
      </div>
      <div class="legend">
        <div><div class="k">Sampling</div><div class="v">Every 5th departure date</div></div>
        <div><div class="k">Window</div><div class="v">60–300 days ahead</div></div>
        <div><div class="k">Covering</div><div class="v">23 Oct – 20 Jun 2027</div></div>
      </div>
    </div>
    <div class="perf">
      <div class="lab">Watching</div>
      <label class="sw"><input type="checkbox" checked><span></span></label>
      <button class="x">Remove</button>
    </div>
  </div>

  <button class="add">Add a route</button>
</div>
</body>
</html>
