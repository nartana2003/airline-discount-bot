<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction F — Big Type</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #fcfcfa;
  --ink: #0d0d0c;
  --ink-2: #4a4a46;
  --ink-3: #8c8c86;
  --line: #0d0d0c;
  --hair: #dcdcd6;
  --hot: #1b3cf0;
  --hot-soft: #e8ebfe;
  --warn: #d4700a;
  --sans: "Archivo", system-ui, sans-serif;
  --mono: "Roboto Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 700px; margin: 0 auto; padding: 44px 24px 80px; }
.tag {
  font: 500 10.5px/1 var(--mono); letter-spacing: .15em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 22px;
}

/* masthead: heavy rule top and bottom */
.mast {
  border-top: 3px solid var(--line); border-bottom: 1px solid var(--line);
  padding: 12px 0; display: flex; align-items: center; gap: 12px; margin-bottom: 0;
}
.mast h1 {
  font: 900 15px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; margin: 0;
}
.grow { flex: 1 1 auto; }
.mast .meta {
  font: 500 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
}
.saved {
  font: 700 9.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
  background: var(--ink); color: var(--paper); padding: 6px 9px;
}

/* the number that matters, oversized */
.hero { border-bottom: 1px solid var(--line); padding: 30px 0 26px; }
.hero .lab {
  font: 500 10px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 14px;
}
.hero .fig {
  display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap;
}
.hero .big {
  font: 900 86px/.82 var(--sans); letter-spacing: -.045em;
  font-variant-numeric: tabular-nums; color: var(--warn);
}
.hero .of {
  font: 500 20px/1 var(--sans); color: var(--ink-2); padding-bottom: 9px;
}
.hero .of b { font-weight: 800; color: var(--ink); }
.hero .grow { min-width: 20px; }
.hero .side { display: flex; gap: 30px; padding-bottom: 8px; }
.hero .side .k {
  font: 500 9.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3);
}
.hero .side .v { font: 800 26px/1 var(--sans); margin-top: 7px; font-variant-numeric: tabular-nums; }
.trackline { display: flex; height: 8px; margin-top: 22px; border: 1px solid var(--line); }
.trackline i { flex: 0 0 88%; background: var(--warn); }

/* route: the codes ARE the design */
.sec {
  font: 500 10px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink-3); padding: 22px 0 12px;
}
.route { border-bottom: 1px solid var(--line); padding-bottom: 26px; }
.codes {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.code {
  font: 900 62px/.85 var(--sans); letter-spacing: -.035em; color: var(--ink);
  width: 3.1ch; border: 0; border-bottom: 3px solid var(--line); background: transparent;
  padding: 0 0 6px; border-radius: 0; text-transform: uppercase;
}
.code:focus { outline: none; border-bottom-color: var(--hot); color: var(--hot); }
.code.dest { color: var(--hot); border-bottom-color: var(--hot); }
.dash { flex: 1 1 40px; height: 3px; background: var(--line); min-width: 30px; }
.ctl { display: flex; align-items: center; gap: 12px; flex: none; }
.sw { position: relative; width: 46px; height: 26px; cursor: pointer; }
.sw input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.sw span { position: absolute; inset: 0; background: var(--hair); border: 1px solid var(--line); transition: background .18s; }
.sw span::after {
  content: ""; position: absolute; width: 18px; height: 18px; background: var(--paper);
  border: 1px solid var(--line); top: 3px; left: 3px; transition: transform .18s;
}
.sw input:checked + span { background: var(--hot); }
.sw input:checked + span::after { transform: translateX(20px); }
.x {
  border: 1px solid var(--line); background: transparent; cursor: pointer;
  font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase;
  padding: 7px 10px; color: var(--ink);
}
.x:hover { background: var(--ink); color: var(--paper); }

.cities {
  display: flex; align-items: center; gap: 10px; margin-top: 12px;
  font: 500 13px/1 var(--sans); color: var(--ink-2);
}
.cities input {
  font: 500 13px/1 var(--sans); color: var(--ink-2); background: transparent;
  border: 0; border-bottom: 1px solid var(--hair); padding: 0 0 4px; width: 15ch;
}
.cities input:focus { outline: none; border-bottom-color: var(--hot); color: var(--ink); }
.cities .sep { color: var(--ink-3); }
.spec input {
  font: 600 14px/1.25 var(--sans); color: var(--ink); background: transparent;
  border: 0; border-bottom: 1px solid var(--hair); padding: 0 0 3px;
  width: 3.5ch; text-align: center; font-variant-numeric: tabular-nums;
}
.spec input:focus { outline: none; border-bottom-color: var(--hot); }
.spec .row { display: flex; align-items: baseline; gap: 6px; margin-top: 7px; }
.spec .row .u { font: 500 13px var(--sans); color: var(--ink-2); }

.specs {
  display: grid; grid-template-columns: repeat(4, minmax(0,1fr));
  gap: 0; margin-top: 22px; border-top: 1px solid var(--hair);
}
.spec { padding: 14px 16px 0 0; border-right: 1px solid var(--hair); }
.spec:last-child { border-right: 0; }
.spec .k {
  font: 500 9px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3);
}
.spec .v { font: 600 14px/1.25 var(--sans); margin-top: 7px; font-variant-numeric: tabular-nums; }

.add {
  width: 100%; margin-top: 22px; padding: 18px; cursor: pointer;
  background: transparent; border: 1px solid var(--line);
  font: 700 11px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--ink);
}
.add:hover { background: var(--ink); color: var(--paper); }
</style>
</head>
<body>
<div class="wrap">
  <div class="tag">Direction F · Big Type</div>

  <div class="mast">
    <h1>Flight Watch</h1>
    <span class="grow"></span>
    <span class="meta">Mon 07:00 · weekly</span>
    <span class="saved">Saved</span>
  </div>

  <div class="hero">
    <div class="lab">Searches this month</div>
    <div class="fig">
      <span class="big">211</span>
      <span class="of">of <b>240</b></span>
      <span class="grow"></span>
      <div class="side">
        <div><div class="k">Routes</div><div class="v">1</div></div>
        <div><div class="k">Per run</div><div class="v">49</div></div>
        <div><div class="k">Spare</div><div class="v">29</div></div>
      </div>
    </div>
    <div class="trackline"><i></i></div>
  </div>

  <div class="sec">Routes</div>

  <div class="route">
    <div class="codes">
      <input class="code" value="BNE" maxlength="3" aria-label="Origin code">
      <span class="dash"></span>
      <input class="code dest" value="NRT" maxlength="3" aria-label="Destination code">
      <span class="ctl">
        <label class="sw"><input type="checkbox" checked><span></span></label>
        <button class="x">Remove</button>
      </span>
    </div>
    <div class="cities">
      <input value="Brisbane" aria-label="Origin city">
      <span class="sep">→</span>
      <input value="Narita, Japan" aria-label="Destination city">
    </div>

    <div class="specs">
      <div class="spec"><div class="k">Trip</div>
        <div class="row">
          <input type="number" value="12" min="1" max="60" aria-label="Trip length">
          <span class="u">days</span>
        </div>
      </div>
      <div class="spec"><div class="k">Sampling</div><div class="v">Every 5th date</div></div>
      <div class="spec"><div class="k">Window</div><div class="v">60–300 days</div></div>
      <div class="spec"><div class="k">Covering</div><div class="v">23 Oct – 20 Jun 27</div></div>
    </div>
  </div>

  <button class="add">+ Add route</button>
</div>
</body>
</html>
